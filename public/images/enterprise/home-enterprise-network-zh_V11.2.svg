<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" fill="none" role="img" aria-labelledby="title description">
  <title id="title">企业内网 · 私有化部署</title>
  <desc id="description">企业知识库、Compose 或 Kubernetes 部署的 TeGo 平台与 vLLM、Qwen 本地模型服务连接同一企业内网，业务系统通过 MCP、RESTful API 或数据库接入，并纳入组织身份权限和审核审计。</desc>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="380" y="49" text-anchor="middle" fill="#d5e6f7" font-size="25" font-weight="500">企业内网 · 私有化部署</text>

    <!-- Resource objects are connected locally; no outer container or application UI. -->
    <g stroke="#3d6587" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M142 278V309C142 321 151 330 163 330H280C293 330 303 340 303 353"/>
      <path d="M380 278V342"/>
      <path d="M618 278V309C618 321 609 330 597 330H480C467 330 457 340 457 353"/>
      <path d="M303 373H274C263 373 254 382 254 394V409C254 421 245 430 233 430H164C152 430 142 440 142 452"/>
      <path d="M457 373H486C497 373 506 382 506 394V409C506 421 515 430 527 430H596C608 430 618 440 618 452"/>
    </g>
    <g fill="#7ca5c9"><circle cx="142" cy="278" r="3"/><circle cx="380" cy="278" r="3"/><circle cx="618" cy="278" r="3"/><circle cx="142" cy="452" r="3"/><circle cx="618" cy="452" r="3"/></g>

    <!-- The document and knowledge store use the same filled duotone vocabulary. -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M94 102Q94 99 97 99H119L138 118V165Q138 169 134 169H98Q94 169 94 165Z" fill="#183b56" stroke="#72a3c8" stroke-width="1.6"/>
      <path d="M119 99V115Q119 118 122 118H138" fill="#2c5b7d" stroke="#72a3c8" stroke-width="1.6"/>
      <path d="M105 129H126M105 139H120" stroke="#91bcdb" stroke-width="1.6"/>
      <path d="M117 130V168C117 175 132.7 181 152 181S187 175 187 168V130" fill="#1c4564" stroke="#92bfe0" stroke-width="1.6"/>
      <ellipse cx="152" cy="130" rx="35" ry="11" fill="#2d5e7e" stroke="#a2cce8" stroke-width="1.6"/>
      <path d="M117 144C117 151 132.7 157 152 157S187 151 187 144M117 157C117 164 132.7 170 152 170S187 164 187 157" stroke="#699abc" stroke-width="1.4"/>
    </g>
    <text x="142" y="213" text-anchor="middle" fill="#d1e3f5" font-size="25" font-weight="500">企业知识库</text>
    <text x="142" y="242" text-anchor="middle" fill="#92afc9" font-size="18">制度文档 · 合同资料</text>
    <text x="142" y="266" text-anchor="middle" fill="#92afc9" font-size="18">业务台账</text>

    <!-- Local compute has actual vents and connectors, without placeholder strokes. -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <rect x="337" y="108" width="86" height="32" rx="4" fill="#285572" stroke="#91c0e2" stroke-width="1.6"/>
      <rect x="337" y="149" width="86" height="32" rx="4" fill="#1c415d" stroke="#73a3c6" stroke-width="1.6"/>
      <g fill="#10283c" stroke="#90b8d7" stroke-width="1.1">
        <path d="M365 119H382V130H365Z"/><path d="M365 160H382V171H365Z"/>
      </g>
      <g stroke="#9dc9e6" stroke-width="1.4">
        <path d="M391 119V130M398 119V130M405 119V130M412 119V130"/>
        <path d="M391 160V171M398 160V171M405 160V171M412 160V171" stroke="#76a7cb"/>
      </g>
      <circle cx="350" cy="124" r="3.1" fill="#aacfe9"/>
      <circle cx="350" cy="165" r="3.1" fill="#7eaccd"/>
      <path d="M348 181V185M412 181V185" stroke="#547c9c" stroke-width="1.5"/>
    </g>
    <text x="380" y="213" text-anchor="middle" fill="#edf5fd" font-size="29" font-weight="600" letter-spacing="-.5">TeGo 平台</text>
    <text x="380" y="242" text-anchor="middle" fill="#a9c7e1" font-size="18">Compose / Kubernetes</text>
    <text x="380" y="266" text-anchor="middle" fill="#92afc9" font-size="18">数字员工 · 任务执行</text>

    <!-- The inference symbol has aligned layers, precise links and a clear central node. -->
    <g stroke="#6799c0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M574 123L611 106L651 124M574 123L611 142L651 124M574 160L611 142L651 161M574 160L611 177L651 161"/>
    </g>
    <g fill="#285777" stroke="#91bfe0" stroke-width="1.4">
      <circle cx="574" cy="123" r="4.5"/><circle cx="574" cy="160" r="4.5"/>
      <circle cx="611" cy="106" r="4.8"/><circle cx="611" cy="177" r="4.8"/>
      <circle cx="651" cy="124" r="4.5"/><circle cx="651" cy="161" r="4.5"/>
    </g>
    <circle cx="611" cy="142" r="6.3" fill="#8cc2e9"/>
    <text x="618" y="213" text-anchor="middle" fill="#d1e3f5" font-size="25" font-weight="500">本地模型服务</text>
    <text x="618" y="242" text-anchor="middle" fill="#a9c7e1" font-size="18">vLLM / Qwen</text>
    <text x="618" y="266" text-anchor="middle" fill="#92afc9" font-size="18">本地推理</text>

    <!-- A compact planar switch uses consistent connector geometry. -->
    <rect x="303" y="342" width="154" height="33" rx="5" fill="#1a3b55" stroke="#80afd1" stroke-width="1.5"/>
    <g fill="#0c2235" stroke="#7ba6c6" stroke-width="1.1" stroke-linejoin="round"><path d="M319 350H328V353H331V364H316V353H319Z"/><path d="M340 350H349V353H352V364H337V353H340Z"/><path d="M361 350H370V353H373V364H358V353H361Z"/><path d="M382 350H391V353H394V364H379V353H382Z"/><path d="M403 350H412V353H415V364H400V353H403Z"/></g>
    <g stroke="#527d9f" stroke-width="1" stroke-linecap="round"><path d="M320 357V361M324 357V361M327 357V361"/><path d="M341 357V361M345 357V361M348 357V361"/><path d="M362 357V361M366 357V361M369 357V361"/><path d="M383 357V361M387 357V361M390 357V361"/><path d="M404 357V361M408 357V361M411 357V361"/></g>
    <circle cx="440" cy="358.5" r="3.4" fill="#10283b" stroke="#8db6d3" stroke-width="1.3"/>
    <text x="380" y="410" text-anchor="middle" fill="#c4dbed" font-size="24" font-weight="500">企业内网</text>

    <!-- Integration and governance terminate on the same internal network. -->
    <g transform="translate(123 465)" stroke="#90b5d3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 9H15M15 9V0H29M15 9V22H29M29 -5V5M29 17V27"/>
      <circle cx="0" cy="9" r="3" fill="#274a67"/><circle cx="29" cy="0" r="3" fill="#274a67"/><circle cx="29" cy="22" r="3" fill="#274a67"/>
    </g>
    <text x="142" y="526" text-anchor="middle" fill="#c9deef" font-size="23">业务系统</text>
    <text x="142" y="553" text-anchor="middle" fill="#92afc9" font-size="17">MCP / RESTful API / 数据库</text>

    <g transform="translate(582 466)" stroke="#90b5d3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="5" r="6"/><path d="M1 29V25C1 19 6 15 12 15S23 19 23 25V29M35 16H55M49 16V23M54 16V20"/>
      <circle cx="31" cy="16" r="5"/>
    </g>
    <text x="618" y="526" text-anchor="middle" fill="#c9deef" font-size="23">组织身份与权限</text>
    <text x="618" y="553" text-anchor="middle" fill="#92afc9" font-size="19">审核与审计</text>
  </g>
</svg>